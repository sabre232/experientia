[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experientia"
version = "1.0.0"
description = "Local experience flywheel for AI agents: capture, verify, distill, inject, revise."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "sabre232" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "keyring>=25.0",
    "zstandard>=0.22",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
# pillow = 报告海报 PNG 导出的运行时依赖（gui/poster.py PIL 渲染）
gui = ["PySide6>=6.6", "pillow>=12.3.0"]
# build = 打包（迁移清单：PyInstaller onedir/windowed，三平台分发）
build = ["pyinstaller>=6.0"]
# decrypt = 本地 agent 加密数据库解密（pycryptodome 用于 SQLCipher AES-CBC）
decrypt = ["pycryptodome>=3.20"]
# babel = 7 语 .po/.mo 编译期工具（scripts/compile_locales.py + i18n_*），运行时用 stdlib gettext 不需要它
# pytest-cov = CI 覆盖率护栏（build.yml 用 --cov=app --cov-fail-under=60；缺它 pytest 直接报
# "unrecognized arguments: --cov" 并让 test job 失败，进而阻断后续 build）
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-timeout>=2.3", "resvg-py>=0.5.0", "babel>=2.14"]

[project.scripts]
experientia = "app.cli:main"
experientia-wrap = "app.wrap:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
